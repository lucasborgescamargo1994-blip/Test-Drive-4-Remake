<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Test Drive 4 Remake - Arcade Mode</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Consolas', sans-serif; color: white; user-select: none; }
        
        /* UI GERAL */
        #debug-panel {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85);
            padding: 12px; border-left: 3px solid #ffcc00; font-size: 11px; z-index: 3000; pointer-events: none;
            display: none;
        }

        #menu-layer {
            position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at center, #222, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2500;
        }

        .menu-box { width: 400px; text-align: center; }
        h1 { color: #ffcc00; font-style: italic; text-transform: uppercase; font-size: 40px; margin-bottom: 30px; }
        
        .btn {
            background: #333; border: 1px solid #555; border-left: 4px solid #ffcc00; color: white;
            padding: 15px; width: 100%; margin: 5px 0; cursor: pointer; text-align: left;
            font-family: 'Consolas', monospace; font-size: 16px; text-transform: uppercase;
        }
        .btn:hover { background: #444; padding-left: 20px; transition: 0.2s; }
        .btn-action { background: #ffcc00; color: black; font-weight: bold; text-align: center; border: none; }
        
        .form-group { text-align: left; margin-bottom: 10px; }
        label { color: #aaa; font-size: 10px; text-transform: uppercase; display: block; }
        select, input { width: 100%; padding: 8px; background: #111; border: 1px solid #444; color: white; }

        /* HUD JOGO */
        #hud-layer { display: none; position: absolute; width: 100%; height: 100%; pointer-events: none; }
        #speed-box { position: absolute; bottom: 20px; right: 20px; text-align: right; }
        .big-text { font-size: 60px; font-weight: bold; color: #ffcc00; }
        .gear-text { font-size: 24px; color: white; margin-left: 10px; border-left: 2px solid #ffcc00; padding-left: 10px; }
        
        #pos-box { position: absolute; top: 20px; left: 20px; }
        .pos-rank { font-size: 50px; font-weight: bold; color: white; }
        .lap-info { font-size: 20px; color: #ffcc00; margin-left: 10px; }

        #results-screen { 
            position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); 
            z-index: 4000; display: none; flex-direction: column; justify-content: center; align-items: center; 
        }
    </style>
</head>
<body>

<div id="debug-panel">
    <div style="color: #ffcc00; font-weight: bold;">DEV MODE</div>
    <div style="margin: 5px 0;">PONTOS: <span id="dbg-points">0</span></div>
    <div style="font-size: 10px; color:#aaa; line-height: 1.4;">
        [P] Adicionar Ponto<br>
        [O] Exportar Código<br>
        <span style="color:#ff4444;">[X] Limpar Rota</span>
    </div>
</div>

<div id="menu-layer">
    <div id="screen-main" class="menu-box">
        <h1>TD4 REMAKE</h1>
        <button class="btn" onclick="Menu.toSetup()">Single Race</button>
        <button class="btn" onclick="Menu.toggleDebug()">Editor Mode: <span id="lbl-debug">OFF</span></button>
    </div>

    <div id="screen-setup" class="menu-box" style="display:none;">
        <h2 style="color:#ffcc00;">CONFIGURAR</h2>
        <div class="form-group">
            <label>Pista</label>
            <select id="opt-map"><option value="burnout_3_winter_city.glb">Winter City</option></select>
        </div>
        <div class="form-group">
            <label>Carro</label>
            <select id="opt-car">
                <option value="cobra.glb">Shelby Cobra</option>
                <option value="viper.glb">Dodge Viper</option>
                <option value="jaguar.glb">Jaguar XJ220</option>
            </select>
        </div>
        <div style="display:flex; gap:10px;">
            <div class="form-group" style="flex:1;">
                <label>Voltas</label><input type="number" id="opt-laps" value="2">
            </div>
            <div class="form-group" style="flex:1;">
                <label>Oponentes</label><input type="number" id="opt-opps" value="3">
            </div>
        </div>
        <button class="btn btn-action" onclick="Game.start()">CORRER</button>
        <button class="btn" onclick="Menu.toMain()" style="font-size:12px; text-align:center;">Voltar</button>
    </div>
</div>

<div id="hud-layer">
    <div id="pos-box">
        <span class="pos-rank" id="hud-pos">1st</span>
        <span class="lap-info">LAP <span id="hud-lap">1/2</span></span>
    </div>
    <div id="speed-box">
        <span class="big-text" id="hud-speed">0</span> <small>KM/H</small>
        <span class="gear-text">GEAR <span id="hud-gear">1</span></span>
    </div>
</div>

<div id="results-screen">
    <h1 id="res-msg">FIM DE JOGO</h1>
    <h2 style="color:white;" id="res-pos"></h2>
    <button class="btn btn-action" style="width:200px;" onclick="location.reload()">MENU</button>
</div>

<script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const GITHUB_BASE = "https://raw.githubusercontent.com/lucasborgescamargo1994-blip/Test-Drive-4-Remake/main/";
    
    // CONFIGURAÇÕES DOS CARROS
    const CAR_SETTINGS = {
        "cobra.glb": { scale: 6.5, topSpeed: 3.2, accelBase: 0.06 },
        "viper.glb": { scale: 7.2, topSpeed: 3.8, accelBase: 0.07 },
        "jaguar.glb": { scale: 20.5, topSpeed: 4.2, accelBase: 0.08 }
    };

    const SAVED_TRACKS = {
        "burnout_3_winter_city.glb": [],
    };

    let scene, camera, renderer, trackMesh, roadLine;
    let clock = new THREE.Clock();
    let keys = {};
    let cars = [];
    let player;
    let trackPath = [];
    let isDebug = false;
    let raceSettings = { laps: 2, opps: 3 };
    let raceState = "MENU";

    window.Menu = {
        toSetup: () => {
            document.getElementById('screen-main').style.display = 'none';
            document.getElementById('screen-setup').style.display = 'block';
        },
        toMain: () => {
            document.getElementById('screen-setup').style.display = 'none';
            document.getElementById('screen-main').style.display = 'block';
        },
        toggleDebug: () => {
            isDebug = !isDebug;
            document.getElementById('lbl-debug').innerText = isDebug ? "ON" : "OFF";
            document.getElementById('lbl-debug').style.color = isDebug ? "#0f0" : "#fff";
        }
    };

    window.Game = {
        start: async () => {
            const map = document.getElementById('opt-map').value;
            const pCar = document.getElementById('opt-car').value;
            raceSettings.laps = parseInt(document.getElementById('opt-laps').value);
            raceSettings.opps = parseInt(document.getElementById('opt-opps').value);

            if(!SAVED_TRACKS[map]) { alert("Rota não encontrada!"); return; }
            trackPath = SAVED_TRACKS[map].map(p => new THREE.Vector3(p.x, p.y, p.z));

            document.getElementById('menu-layer').style.display = 'none';
            document.getElementById('hud-layer').style.display = 'block';
            if(isDebug) document.getElementById('debug-panel').style.display = 'block';

            await init3D(map);
            
            const startP = getGridPos(0);
            player = new Car(true, pCar, startP.pos, startP.dir);
            await player.load();
            cars.push(player);

            const aiModels = ["cobra.glb", "viper.glb", "jaguar.glb"];
            for(let i=0; i<raceSettings.opps; i++) {
                const model = aiModels[Math.floor(Math.random()*aiModels.length)];
                const startA = getGridPos(i+1);
                const ai = new Car(false, model, startA.pos, startA.dir);
                await ai.load();
                cars.push(ai);
            }

            raceState = "RACING";
            animate();
        }
    };

    function getGridPos(idx) {
        if(trackPath.length < 2) return { pos: new THREE.Vector3(idx*5, 2, 0), dir: new THREE.Vector3(0,0,1) };
        const p1 = trackPath[0];
        const p2 = trackPath[1];
        const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
        const side = new THREE.Vector3(0,1,0).cross(dir).normalize();
        const pos = p1.clone().sub(dir.clone().multiplyScalar(idx * 12 + 10));
        if(idx % 2 !== 0) pos.add(side.clone().multiplyScalar(5));
        else pos.add(side.clone().multiplyScalar(-5));
        return { pos, dir };
    }

    class Car {
        constructor(isPlayer, model, pos, dir) {
            this.isPlayer = isPlayer;
            this.model = model;
            this.pos = pos;
            this.dir = dir;
            this.mesh = null;
            this.speed = 0;
            this.gear = 1;
            this.maxGears = 5;
            this.config = CAR_SETTINGS[model] || CAR_SETTINGS["cobra.glb"];
            
            this.currentIdx = 1;
            this.lap = 1;
            this.finished = false;
        }

        async load() {
            const loader = new GLTFLoader();
            const gltf = await loader.loadAsync(GITHUB_BASE + this.model);
            this.mesh = gltf.scene;
            const box = new THREE.Box3().setFromObject(this.mesh);
            const size = box.getSize(new THREE.Vector3());
            const scale = this.config.scale / Math.max(size.x, size.y, size.z);
            this.mesh.scale.set(scale, scale, scale);
            this.mesh.position.copy(this.pos);
            this.mesh.lookAt(this.pos.clone().add(this.dir));
            scene.add(this.mesh);
        }

        update() {
            if(!this.mesh || this.finished) return;

            if(this.isPlayer) {
                // ACELERAÇÃO PROGRESSIVA E MARCHAS
                if(keys['w']) {
                    // O torque diminui conforme a marcha sobe (1ª marcha arranca forte, 5ª é lenta)
                    let torque = this.config.accelBase * (1.2 - (this.gear * 0.15));
                    let maxSpeedInGear = (this.config.topSpeed / this.maxGears) * this.gear;

                    if(this.speed < maxSpeedInGear) {
                        this.speed += torque;
                    }

                    // Troca automática de marcha (ao atingir 90% da velocidade da marcha)
                    if(this.speed > maxSpeedInGear * 0.9 && this.gear < this.maxGears) {
                        this.gear++;
                    }
                } else {
                    this.speed *= 0.99; // Freio motor suave
                }

                if(keys['s']) {
                    this.speed -= 0.12; // Freio
                    // Reduz marcha ao frear muito
                    let minSpeedForGear = (this.config.topSpeed / this.maxGears) * (this.gear - 1);
                    if(this.speed < minSpeedForGear * 0.8 && this.gear > 1) {
                        this.gear--;
                    }
                }

                this.speed *= 0.985; // Atrito constante

                if(Math.abs(this.speed) > 0.1) {
                    const steerLimit = 0.045 * (1 - (this.speed / (this.config.topSpeed * 1.5))); // Menos esterço em alta
                    if(keys['a']) this.mesh.rotation.y += steerLimit;
                    if(keys['d']) this.mesh.rotation.y -= steerLimit;
                }
            } else {
                // AI SIMPLES
                const target = trackPath[this.currentIdx] || new THREE.Vector3(0,0,0);
                const lookPos = new THREE.Vector3(target.x, this.mesh.position.y, target.z);
                this.mesh.lookAt(lookPos);
                if(this.speed < (this.config.topSpeed * 0.85)) this.speed += 0.05;
            }

            this.mesh.translateZ(this.speed);
            this.applyTrackGuard(13);

            const ray = new THREE.Raycaster(this.mesh.position.clone().add(new THREE.Vector3(0,50,0)), new THREE.Vector3(0,-1,0));
            const hits = ray.intersectObject(trackMesh);
            if(hits.length > 0) {
                this.mesh.position.y = hits[0].point.y + (this.config.scale * 0.15);
            }

            if(trackPath.length > 0) {
                const target = trackPath[this.currentIdx];
                if(this.mesh.position.distanceTo(target) < 30) {
                    this.currentIdx++;
                    if(this.currentIdx >= trackPath.length) {
                        this.currentIdx = 0;
                        this.lap++;
                        if(this.lap > raceSettings.laps) this.finish();
                    }
                }
            }
        }

        finish() {
            this.finished = true;
            if(this.isPlayer) {
                document.getElementById('hud-layer').style.display = 'none';
                document.getElementById('results-screen').style.display = 'flex';
                const rank = document.getElementById('hud-pos').innerText;
                document.getElementById('res-pos').innerText = "Position: " + rank;
                document.getElementById('res-msg').innerText = rank.startsWith('1') ? "VICTORY!" : "FINISHED";
            }
        }

        applyTrackGuard(limit) {
            if(trackPath.length < 2) return;
            let minDist = Infinity;
            let closestP = new THREE.Vector3();
            for(let i=0; i < trackPath.length - 1; i++) {
                const p1 = trackPath[i], p2 = trackPath[i+1];
                const line = new THREE.Vector3().subVectors(p2, p1);
                const len = line.length();
                line.normalize();
                const d = Math.max(0, Math.min(len, new THREE.Vector3().subVectors(this.mesh.position, p1).dot(line)));
                const proj = p1.clone().add(line.multiplyScalar(d));
                const dist = this.mesh.position.distanceTo(proj);
                if(dist < minDist) { minDist = dist; closestP = proj; }
            }
            if(minDist > limit) {
                const dir = new THREE.Vector3().subVectors(closestP, this.mesh.position).normalize();
                this.mesh.position.add(dir.multiplyScalar(minDist - limit));
                this.speed *= 0.95;
            }
        }
    }

    async function init3D(mapName) {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 200, 1500);
        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 5000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(500, 1500, 500);
        scene.add(sun);

        if(isDebug) {
            const lineGeo = new THREE.BufferGeometry().setFromPoints(trackPath);
            roadLine = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffff00 }));
            scene.add(roadLine);
        }

        const loader = new GLTFLoader();
        const tGltf = await loader.loadAsync(GITHUB_BASE + mapName);
        trackMesh = tGltf.scene;
        trackMesh.scale.set(150, 150, 150);
        scene.add(trackMesh);

        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            keys[k] = true;
            if(isDebug) {
                if(k === 'p' && player) {
                    trackPath.push(player.mesh.position.clone());
                    if(roadLine) roadLine.geometry.setFromPoints(trackPath);
                    else {
                        const lineGeo = new THREE.BufferGeometry().setFromPoints(trackPath);
                        roadLine = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffff00 }));
                        scene.add(roadLine);
                    }
                    document.getElementById('dbg-points').innerText = trackPath.length;
                }
                if(k === 'o') {
                    console.log(JSON.stringify(trackPath.map(p => ({x:p.x, y:p.y, z:p.z}))));
                    alert("Caminho exportado no console!");
                }
                if(k === 'x') {
                    if(confirm("Limpar rota?")) {
                        trackPath = [];
                        if(roadLine) { scene.remove(roadLine); roadLine = null; }
                        document.getElementById('dbg-points').innerText = "0";
                    }
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    }

    function animate() {
        requestAnimationFrame(animate);
        if(raceState !== "RACING") return;

        cars.forEach(c => c.update());

        if(player && player.mesh) {
            const displaySpeed = Math.floor(Math.abs(player.speed) * 65);
            document.getElementById('hud-speed').innerText = displaySpeed;
            document.getElementById('hud-gear').innerText = player.gear;
            document.getElementById('hud-lap').innerText = `${player.lap}/${raceSettings.laps}`;

            const myScore = (player.lap * 10000) + player.currentIdx;
            let rank = 1;
            cars.forEach(c => {
                if(!c.isPlayer) {
                    const enemyScore = (c.lap * 10000) + c.currentIdx;
                    if(enemyScore > myScore) rank++;
                }
            });
            const suf = ["st","nd","rd","th"];
            document.getElementById('hud-pos').innerText = rank + (rank<=3?suf[rank-1]:"th");

            const camOff = new THREE.Vector3(0, 5, -12).applyQuaternion(player.mesh.quaternion);
            camera.position.lerp(player.mesh.position.clone().add(camOff), 0.1);
            camera.lookAt(player.mesh.position.clone().add(new THREE.Vector3(0, 2, 0)));
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Test Drive 4 Remake - Sticky Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Consolas', sans-serif; color: white; user-select: none; }
        #debug-panel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85); padding: 12px; border-left: 3px solid #ffcc00; font-size: 11px; z-index: 3000; display: none; }
        #menu-layer, #pause-layer, #screen-settings { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at center, #222, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2500; }
        #pause-layer { background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; z-index: 3500; }
        .menu-box { width: 400px; text-align: center; }
        h1 { color: #ffcc00; font-style: italic; text-transform: uppercase; font-size: 40px; margin-bottom: 30px; }
        .btn { background: #333; border: 1px solid #555; border-left: 4px solid #ffcc00; color: white; padding: 15px; width: 100%; margin: 5px 0; cursor: pointer; text-align: left; font-family: 'Consolas', monospace; font-size: 16px; text-transform: uppercase; }
        .btn:hover { background: #444; padding-left: 20px; transition: 0.2s; }
        .btn-action { background: #ffcc00; color: black; font-weight: bold; text-align: center; border: none; }
        .form-group { text-align: left; margin-bottom: 10px; }
        label { color: #aaa; font-size: 10px; text-transform: uppercase; display: block; }
        select, input { width: 100%; padding: 8px; background: #111; border: 1px solid #444; color: white; }
        #hud-layer { display: none; position: absolute; width: 100%; height: 100%; pointer-events: none; }
        #speed-box { position: absolute; bottom: 20px; right: 20px; text-align: right; }
        .big-text { font-size: 60px; font-weight: bold; color: #ffcc00; }
        .gear-text { font-size: 24px; color: white; margin-left: 10px; border-left: 2px solid #ffcc00; padding-left: 10px; }
        #pos-box { position: absolute; top: 20px; left: 20px; }
        .pos-rank { font-size: 50px; font-weight: bold; color: white; }
        .lap-info { font-size: 20px; color: #ffcc00; margin-left: 10px; }
        #results-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 4000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .slider-wrap { margin: 15px 0; text-align: left; }
        .slider-wrap label { font-size: 12px; color: #ffcc00; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ffcc00; }
        #reset-overlay { position: absolute; top: 20%; width: 100%; text-align: center; color: #ffcc00; font-size: 24px; font-weight: bold; display: none; text-shadow: 2px 2px #000; z-index: 5000; }
    </style>
</head>
<body>

<div id="reset-overlay">CARRO CAPOTADO! RESET EM <span id="reset-cd">3</span>...</div>

<div id="debug-panel">
    <div style="color: #ffcc00; font-weight: bold;">DEV MODE</div>
    <div style="margin: 5px 0;">PONTOS: <span id="dbg-points">0</span></div>
    <div style="font-size: 10px; color:#aaa; line-height: 1.4;">
        [P] Adicionar Ponto<br>[O] Exportar Código<br>[X] Limpar Rota<br>[ESC] Pausar/Câmera
    </div>
</div>

<div id="pause-layer">
    <div class="menu-box">
        <h1 style="font-size: 30px;">PAUSE</h1>
        <div class="slider-wrap"><label>DISTÂNCIA DA CÂMERA</label><input type="range" id="cam-dist" min="5" max="30" value="12" oninput="Game.updateCamParams()"></div>
        <div class="slider-wrap"><label>ALTURA DA CÂMERA</label><input type="range" id="cam-height" min="1" max="15" value="5" oninput="Game.updateCamParams()"></div>
        <button class="btn btn-action" onclick="Game.resume()">CONTINUAR</button>
        <button class="btn" onclick="location.reload()">MENU PRINCIPAL</button>
    </div>
</div>

<div id="menu-layer">
    <div id="screen-main" class="menu-box">
        <h1>TD4 REMAKE</h1>
        <button class="btn" onclick="Menu.toSetup()">Single Race</button>
        <button class="btn" onclick="Menu.toSettings()">Settings</button>
        <button class="btn" onclick="Menu.toggleDebug()">Editor Mode: <span id="lbl-debug">OFF</span></button>
    </div>
    <div id="screen-settings" class="menu-box" style="display:none;">
        <h2 style="color:#ffcc00;">SETTINGS</h2>
        <div class="form-group">
            <label>Qualidade Gráfica</label>
            <select id="opt-graphics">
                <option value="1">Máximo (100%)</option>
                <option value="0.5">Baixo (50%)</option>
            </select>
        </div>
        <div class="form-group"><label>Volume Geral</label><input type="range" id="opt-volume" min="0" max="1" step="0.1" value="1"></div>
        <button class="btn" onclick="Menu.toMain()">Voltar</button>
    </div>
    <div id="screen-setup" class="menu-box" style="display:none;">
        <h2 style="color:#ffcc00;">CONFIGURAR</h2>
        <div class="form-group">
            <label>Pista</label>
            <select id="opt-map"><option value="burnout_3_winter_city.glb">Winter City</option></select>
        </div>
        <div class="form-group">
            <label>Carro</label>
            <select id="opt-car">
                <option value="cobra.glb">Shelby Cobra</option>
                <option value="viper.glb">Dodge Viper</option>
                <option value="jaguar.glb">Jaguar XJ220</option>
            </select>
        </div>
        <div style="display:flex; gap:10px;">
            <div class="form-group" style="flex:1;"><label>Voltas</label><input type="number" id="opt-laps" value="2"></div>
            <div class="form-group" style="flex:1;"><label>Oponentes</label><input type="number" id="opt-opps" value="3"></div>
        </div>
        <div class="form-group">
            <label>Tráfego Civil</label>
            <select id="opt-traffic">
                <option value="6">Leve (6 carros)</option>
                <option value="12">Normal (12 carros)</option>
                <option value="0">Desativado</option>
            </select>
        </div>
        <button class="btn btn-action" onclick="Game.start()">CORRER</button>
        <button class="btn" onclick="Menu.toMain()">Voltar</button>
    </div>
</div>

<div id="hud-layer">
    <div id="pos-box"><span class="pos-rank" id="hud-pos">1st</span><span class="lap-info">LAP <span id="hud-lap">1/2</span></span></div>
    <div id="speed-box"><span class="big-text" id="hud-speed">0</span> <small>KM/H</small><span class="gear-text">GEAR <span id="hud-gear">1</span></span></div>
</div>

<div id="results-screen"><h1 id="res-msg">FIM DE JOGO</h1><h2 style="color:white;" id="res-pos"></h2><button class="btn btn-action" style="width:200px;" onclick="location.reload()">MENU</button></div>

    let scene, camera, renderer, trackMesh, roadLine;

    window.Menu = {
        toSetup: () => { document.getElementById('screen-main').style.display = 'none'; document.getElementById('screen-setup').style.display = 'block'; },
        toSettings: () => { document.getElementById('screen-main').style.display = 'none'; document.getElementById('screen-settings').style.display = 'block'; },
        toMain: () => { document.getElementById('screen-setup').style.display = 'none'; document.getElementById('screen-settings').style.display = 'none'; document.getElementById('screen-main').style.display = 'block'; },
        toggleDebug: () => { isDebug = !isDebug; document.getElementById('lbl-debug').innerText = isDebug ? "ON" : "OFF"; document.getElementById('lbl-debug').style.color = isDebug ? "#0f0" : "#fff"; },
        applyGraphics: () => {
            if(!renderer) return;
            const scale = parseFloat(document.getElementById('opt-graphics').value);
            renderer.setSize(window.innerWidth * scale, window.innerHeight * scale, false);
            renderer.domElement.style.width = window.innerWidth + 'px';
            renderer.domElement.style.height = window.innerHeight + 'px';
        }
    };

    window.Game = {
        start: async () => {
            const map = document.getElementById('opt-map').value;
            const pCar = document.getElementById('opt-car').value;
            raceSettings.laps = parseInt(document.getElementById('opt-laps').value);
            raceSettings.opps = parseInt(document.getElementById('opt-opps').value);
            const trafficCount = parseInt(document.getElementById('opt-traffic').value);

            trackPath = (SAVED_TRACKS[map] || []).map(p => new THREE.Vector3(p.x, p.y, p.z));

            document.getElementById('menu-layer').style.display = 'none';
            document.getElementById('hud-layer').style.display = 'block';
            if(isDebug) document.getElementById('debug-panel').style.display = 'block';

            await init3D(map);
            
            const startP = getGridPos(0);
            player = new Car(true, pCar, startP.pos, startP.dir);
            await player.load();
            cars.push(player);

            const aiModels = ["cobra.glb", "viper.glb", "jaguar.glb"];
            for(let i=0; i<raceSettings.opps; i++) {
                const startA = getGridPos(i+1);
                const ai = new Car(false, aiModels[i%3], startA.pos, startA.dir);
                await ai.load();
                cars.push(ai);
            }

            if(trafficCount > 0 && trackPath.length > 5) {
                for(let i=0; i<trafficCount; i++) {
                    const tCar = new Car(false, "van.glb", new THREE.Vector3(0,-100,0), new THREE.Vector3(0,0,1));
                    tCar.isTraffic = true;
                    tCar.reverse = (i % 2 === 0);
                    await tCar.load();
                    tCar.respawnAtNode(Math.floor((trackPath.length / trafficCount) * i));
                    trafficCars.push(tCar);
                }
            }

            raceState = "RACING";
            animate();
        },
        resume: () => { isPaused = false; document.getElementById('pause-layer').style.display = 'none'; },

    };

    function getGridPos(idx) {
        if(trackPath.length < 2) return { pos: new THREE.Vector3(idx*5, 2, 0), dir: new THREE.Vector3(0,0,1) };
        const p1 = trackPath[0], p2 = trackPath[1];
        const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
        const side = new THREE.Vector3(0,1,0).cross(dir).normalize();
        const pos = p1.clone().sub(dir.clone().multiplyScalar(idx * 12 + 10));
        pos.add(side.clone().multiplyScalar(idx % 2 !== 0 ? 5 : -5));
        pos.y += 1; 
        return { pos, dir };
    }

    class Car {
        constructor(isPlayer, model, pos, dir) {
			this.yaw = Math.atan2(dir.z, dir.x); // Ângulo de direção acumulado
			this.normalBuffer = [];
			this.normalBuffer = []; // Guarda as últimas normais para tirar a média
            this.isPlayer = isPlayer; this.model = model; this.pos = pos; this.dir = dir;
            this.mesh = null; this.speed = 0; this.gear = 1; this.maxGears = 5;
            this.config = CAR_SETTINGS[model] || CAR_SETTINGS["cobra.glb"];
            this.currentIdx = 1; this.lap = 1; this.finished = false;
            this.isTraffic = false; this.reverse = false;
            this.velocityY = 0;
            this.onGround = false;
            this.rotVelocity = new THREE.Vector3(0, 0, 0); 
            this.isFlipped = false;
            this.flipTimer = 0;
        }

        async load() {
            const loader = new GLTFLoader();
            const gltf = await loader.loadAsync(GITHUB_BASE + this.model);
            this.mesh = gltf.scene;
            this.mesh.traverse(obj => { if(obj.isMesh) { obj.castShadow = false; obj.receiveShadow = false; } });
            const box = new THREE.Box3().setFromObject(this.mesh);
            const size = box.getSize(new THREE.Vector3());
            const scale = this.config.scale / Math.max(size.x, size.y, size.z);
            this.mesh.scale.set(scale, scale, scale);
            this.mesh.position.copy(this.pos);
            this.mesh.lookAt(this.pos.clone().add(this.dir));
            scene.add(this.mesh);
        }

        respawnAtNode(idx) {
            this.currentIdx = idx % trackPath.length;
            const p = trackPath[this.currentIdx];
            this.mesh.position.copy(p);
            this.mesh.position.y += 1.5;
            const next = trackPath[(this.currentIdx + 1) % trackPath.length];
            const dir = new THREE.Vector3().subVectors(next, p).normalize();
            const side = new THREE.Vector3(0,1,0).cross(dir).normalize();
            this.mesh.position.add(side.multiplyScalar(this.reverse ? -6 : 6));
        }

        resetFlipped() {
            this.mesh.rotation.x = 0;
            this.mesh.rotation.z = 0;
            this.rotVelocity.set(0,0,0);
            this.velocityY = 0;
            this.speed = 0;
            this.mesh.position.y += 2;
            this.isFlipped = false;
            this.flipTimer = 0;
            if(this.isPlayer) document.getElementById('reset-overlay').style.display = 'none';
        }

        // NOVA FUNÇÃO: Alinha o carro à inclinação do solo
        alignToGround(hit) {
    let currentNormal = hit.face.normal.clone().applyQuaternion(trackMesh.quaternion);
    
    // Suavização da normal
    this.normalBuffer.push(currentNormal);
    if (this.normalBuffer.length > 10) this.normalBuffer.shift(); 
    let averagedNormal = new THREE.Vector3(0, 0, 0);
    this.normalBuffer.forEach(n => averagedNormal.add(n));
    averagedNormal.divideScalar(this.normalBuffer.length).normalize();

    // 1. Criamos a direção baseada no YAW que você controla nas teclas
    const forward = new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw));
    
    // 2. Calculamos os eixos (Right e TrueForward) baseados na inclinação do solo
    let right = new THREE.Vector3().crossVectors(forward, averagedNormal).normalize();
    let trueForward = new THREE.Vector3().crossVectors(averagedNormal, right).normalize();

    // 3. Montamos a matriz final
    const matrix = new THREE.Matrix4();
    matrix.makeBasis(right, averagedNormal, trueForward.negate());
    
    const targetQuat = new THREE.Quaternion().setFromRotationMatrix(matrix);

    // 4. Slerp: Aplica a rotação de forma firme mas suave
    this.mesh.quaternion.slerp(targetQuat, 0.15);
}
        update() {
            if(!this.mesh || this.finished) return;
            const distToPlayer = this.mesh.position.distanceTo(player.mesh.position);

            if(!this.isPlayer) {
                if(distToPlayer > 450) {
                    if(this.mesh.parent) scene.remove(this.mesh);
                    return; 
                } else if(!this.mesh.parent) scene.add(this.mesh);
            }

            if(this.isPlayer && !this.isFlipped) {
                if(keys['w']) {
                    let torque = this.config.accelBase * (1.2 - (this.gear * 0.15));
                    let maxSpeedInGear = (this.config.topSpeed / this.maxGears) * this.gear;
                    if(this.speed < maxSpeedInGear) this.speed += torque;
                    if(this.speed > maxSpeedInGear * 0.9 && this.gear < this.maxGears) this.gear++;
                } else this.speed *= 0.99;
                if(keys['s']) {
                    this.speed -= 0.12;
                    let minSpeedForGear = (this.config.topSpeed / this.maxGears) * (this.gear - 1);
                    if(this.speed < minSpeedForGear * 0.8 && this.gear > 1) this.gear--;
                }
                this.speed *= 0.985;
                if(Math.abs(this.speed) > 0.1) {
        const steerLimit = 0.05 * (1 - (this.speed / (this.config.topSpeed * 1.8)));
        if(keys['a']) this.yaw += steerLimit; // Vira para esquerda
        if(keys['d']) this.yaw -= steerLimit; // Vira para direita
    }

            } else if (!this.isPlayer && !this.isFlipped) {
    const target = trackPath[this.currentIdx] || new THREE.Vector3(0,0,0);
    
    // CALCULA O YAW DA IA PARA O PRÓXIMO PONTO
    const dx = target.x - this.mesh.position.x;
    const dz = target.z - this.mesh.position.z;
    const targetYaw = Math.atan2(dx, dz);
    
    // Suaviza a curva da IA (para não virar bruscamente)
    let diff = targetYaw - this.yaw;
    while (diff < -Math.PI) diff += Math.PI * 2;
    while (diff > Math.PI) diff -= Math.PI * 2;
    this.yaw += diff * 0.1; 

    this.speed = this.isTraffic ? 0.8 : (this.config.topSpeed * 0.85);
}

            this.mesh.translateZ(this.speed);
            
            let downforce = Math.abs(this.speed) * DOWNFORCE_MULT;
            this.velocityY -= (GRAVITY + downforce);
            this.mesh.position.y += this.velocityY;

            // Mantém a rotação de capotamento caso esteja no ar
            if(!this.onGround) {
                this.mesh.rotation.x += this.rotVelocity.x;
                this.mesh.rotation.z += this.rotVelocity.z;
                this.rotVelocity.multiplyScalar(0.92);
            }

            if(this.isPlayer || distToPlayer < 250) {
    // IMPORTANTE: O raio deve sair de um ponto acima do carro, 
    // mas sem herdar a inclinação dele (usando Vector3 puro)
    const rayOrigin = new THREE.Vector3(this.mesh.position.x, this.mesh.position.y + 3.0, this.mesh.position.z);
    const ray = new THREE.Raycaster(rayOrigin, new THREE.Vector3(0, -1, 0), 0, 10); // Raio de 10 metros
    const hits = ray.intersectObject(trackMesh);

                if(hits.length > 0) {
    const groundY = hits[0].point.y + 0.15;
    if(this.mesh.position.y <= groundY + 0.5) { 
        this.mesh.position.y = groundY;
        this.velocityY = 0;
        this.onGround = true;
        this.alignToGround(hits[0]);
        
    } else {
        this.onGround = false;
        // Opcional: Se estiver no ar, o carro tende a voltar para o nível horizontal suavemente
        const horizontalQuat = this.mesh.quaternion.clone();
        // (Isso evita que o carro fique "congelado" na inclinação da rampa após saltar)
    }
}
            }

            const upVec = new THREE.Vector3(0, 1, 0).applyQuaternion(this.mesh.quaternion);
            if (upVec.y < 0.25) {
                this.isFlipped = true;
                this.flipTimer += 1/60;
                if(this.isPlayer) {
                    document.getElementById('reset-overlay').style.display = 'block';
                    document.getElementById('reset-cd').innerText = Math.ceil(3 - this.flipTimer);
                }
                if(this.flipTimer >= 3) this.resetFlipped();
            } else {
                if(this.onGround) {
                   this.isFlipped = false;
                   this.flipTimer = 0;
                   if(this.isPlayer) document.getElementById('reset-overlay').style.display = 'none';
                }
            }

            if (trackPath && trackPath.length > 0 && trackPath[this.currentIdx]) {
                if (this.mesh.position.distanceTo(trackPath[this.currentIdx]) < 35) {
                    if(this.reverse) { this.currentIdx = (this.currentIdx - 1 + trackPath.length) % trackPath.length; }
                    else {
                        this.currentIdx = (this.currentIdx + 1) % trackPath.length;
                        if(this.currentIdx === 0 && !this.isTraffic) { this.lap++; if(this.lap > raceSettings.laps) this.finish(); }
                    }
                }
            }
            if(!this.isTraffic) this.applyTrackGuard(13);
        }

        finish() { this.finished = true; if(this.isPlayer) { document.getElementById('hud-layer').style.display = 'none'; document.getElementById('results-screen').style.display = 'flex'; document.getElementById('res-pos').innerText = "Position: " + document.getElementById('hud-pos').innerText; } }
        
        applyTrackGuard(limit) {
            if(trackPath.length < 2 || this.isFlipped) return;
            let minDist = Infinity; let closestP = new THREE.Vector3();
            for(let i=0; i < trackPath.length - 1; i++) {
                const p1 = trackPath[i], p2 = trackPath[i+1];
                const line = new THREE.Vector3().subVectors(p2, p1);
                const len = line.length(); line.normalize();
                const d = Math.max(0, Math.min(len, new THREE.Vector3().subVectors(this.mesh.position, p1).dot(line)));
                const proj = p1.clone().add(line.multiplyScalar(d));
                const dist = this.mesh.position.distanceTo(proj);
                if(dist < minDist) { minDist = dist; closestP = proj; }
            }
            if(minDist > limit) { this.mesh.position.add(new THREE.Vector3().subVectors(closestP, this.mesh.position).normalize().multiplyScalar(minDist - limit)); this.speed *= 0.95; }
        }
    }

    async function init3D(mapName) {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        camera = new THREE.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 1, 2000);
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(window.devicePixelRatio > 1 ? 1.2 : 1);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        Menu.applyGraphics();
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(500, 1000, 500);
        scene.add(sun);
        const loader = new GLTFLoader();
        const tGltf = await loader.loadAsync(GITHUB_BASE + mapName);
        trackMesh = tGltf.scene;
        trackMesh.scale.set(150, 150, 150);
        scene.add(trackMesh);

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(e.key === "Escape" && raceState === "RACING") { isPaused ? Game.resume() : (isPaused=true, document.getElementById('pause-layer').style.display='flex'); }
            if(isDebug && !isPaused) {
                if(e.key.toLowerCase() === 'p' && player) {
                    trackPath.push(player.mesh.position.clone());
                    if(roadLine) roadLine.geometry.setFromPoints(trackPath);
                    else { roadLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(trackPath), new THREE.LineBasicMaterial({ color: 0xffff00 })); scene.add(roadLine); }
                    document.getElementById('dbg-points').innerText = trackPath.length;
                }
                if(e.key.toLowerCase() === 'x' && confirm("Limpar rota?")) { trackPath = []; if(roadLine) { scene.remove(roadLine); roadLine = null; } }
                if(e.key.toLowerCase() === 'o') console.log(JSON.stringify(trackPath));
            }
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    }

    function animate() {
    requestAnimationFrame(animate);
    if(raceState !== "RACING" || isPaused) return;

    cars.forEach(c => c.update());
    trafficCars.forEach(t => t.update());

    if(player && player.mesh) {
        // HUD Updates
        document.getElementById('hud-speed').innerText = Math.floor(Math.abs(player.speed) * 65);
        document.getElementById('hud-gear').innerText = player.gear;
        document.getElementById('hud-lap').innerText = `${player.lap}/${raceSettings.laps}`;

        // --- SISTEMA DE CÂMERA ESTABILIZADA ---
        
        // 1. Criamos a posição alvo (atrás do carro)
        const idealOffset = new THREE.Vector3(0, camSettings.height, -camSettings.dist);
        idealOffset.applyQuaternion(player.mesh.quaternion);
        const targetPos = player.mesh.position.clone().add(idealOffset);

        // 2. Suavizamos o movimento da posição (Lerp)
        camera.position.lerp(targetPos, 0.15);

        // 3. Suavizamos para onde a câmera olha (LookAt estável)
        // Criamos um ponto de foco à frente do carro para evitar que a câmera balance com a suspensão
        const lookTarget = player.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0));
        
        // Em vez de lookAt direto, usamos uma rotação suave
        const currentQuat = camera.quaternion.clone();
        camera.lookAt(lookTarget);
        const targetQuat = camera.quaternion.clone();
        camera.quaternion.copy(currentQuat);
        camera.quaternion.slerp(targetQuat, 0.1); // Este 0.1 remove o tremor lateral (Eixo X)

        // --- CÁLCULO DE RANK ---
        let rank = 1;
        cars.forEach(c => { 
            if(c !== player && (c.lap > player.lap || (c.lap === player.lap && c.currentIdx > player.currentIdx))) rank++; 
        });
        const suffix = ["st", "nd", "rd", "th"];
        document.getElementById('hud-pos').innerText = rank + (suffix[rank-1] || "th");
    }
    renderer.render(scene, camera);
}
</script>
